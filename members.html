        <div class="cloud cloud-bg-1"></div>
        <div class="cloud cloud-bg-2"></div>
        <div class="cloud cloud-bg-3"></div>

        <div class="star star-bg-2"></div>
        <div class="star star-bg-3"></div>
        <div class="star star-bg-4"></div>

    <header>

            <div class="navbar-buttons">
                <a href="https://chat.whatsapp.com/EDqaY8udJmFCTVCTex3b5p" class="btn-navbar btn-whatsapp icon-btn tooltip-theme" target="_blank" aria-label="WhatsApp" data-tooltip="WhatsApp">

                <button id="notificationBell" class="btn-navbar btn-notifications icon-btn tooltip-theme" style="position: relative; display: none;" aria-label="Notifica&ccedil;&otilde;es" data-tooltip="Notifica&ccedil;&otilde;es">
                    <img src="/imagens/Sino.png" alt="Notifica&ccedil;&otilde;es" class="navbar-icon" width="16" height="16">
                    <span id="notificationBadge" class="notification-badge" style="display: none;"></span>
                </button>
                <a href="login.html" class="btn-navbar btn-login icon-btn tooltip-theme" aria-label="Login" data-tooltip="Login">

                </a>
                <button id="profileCardBtn" class="btn-navbar icon-btn tooltip-theme" style="display: none; position: relative;" aria-label="Perfil" data-tooltip="Perfil">

                </button>

    <main class="container">
        <section class="content-section">
            <div class="members-toolbar">
                <div class="members-search">
                    <label for="membersSearch">Buscar membro</label>
                    <input id="membersSearch" type="text" placeholder="Digite nome ou nickname">
                </div>
                <div class="members-sort">
                    <label for="membersSort">Ordenar</label>
                    <select id="membersSort">
                        <option value="recent">Mais recentes</option>
                        <option value="posts">Postagens</option>
                        <option value="likes">Likes recebidos</option>
                        <option value="favorites">Favoritos recebidos</option>
                        <option value="hearts">Corações recebidos</option>
                        <option value="name">Nome (A-Z)</option>
                    </select>
                </div>
                <div class="members-summary" id="membersSummary">
                    0 membros
                </div>
            </div>

            <div id="membersLoading" class="members-loading">Carregando membros...</div>
            <div id="membersEmpty" class="members-empty" style="display: none;">Nenhum membro encontrado.</div>
            <div id="membersList" class="members-list"></div>
            <button id="membersLoadMore" class="members-load-more" style="display: none;">Carregar mais</button>
        </section>
    </main>

    <div id="notificationToast"></div>
    <footer>
        <div class="container">
